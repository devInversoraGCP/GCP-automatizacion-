# CI del backend AuditAI (Fase 3, doc 27): corre la suite de tests en cada push
# y PR. Es la red de seguridad para no romper lo que ya anda antes de que Render
# despliegue. No toca producción ni necesita secretos (todo va mockeado).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r notion_automation/requirements.txt -r notion_automation/requirements-dev.txt

      - name: Correr tests
        run: python -m pytest
