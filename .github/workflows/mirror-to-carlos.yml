name: Espejo al repo de Carlos (gcp-dev26)

# Copia (espeja) ESTE repo (la fuente, cuenta madre) al repo de Carlos en cada
# push a main. Carlos no hace nada: su repo queda siempre identico a este.
# El job corre en la NUBE de GitHub, no en el PC del dev: por eso el dev nunca
# necesita conectarse a la cuenta de Carlos desde su maquina.
#
# Requisito: un secret MIRROR_TOKEN = PAT fine-grained de la cuenta gcp-dev26
# con permiso "Contents: Read and write" SOLO sobre el repo de Carlos.
# Mientras el secret no exista, el job se salta solo (no falla).
#
# Cambiar CARLOS_REPO abajo si el repo de Carlos tiene otro nombre.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestana Actions

jobs:
  espejo:
    runs-on: ubuntu-latest
    env:
      MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
      CARLOS_REPO: gcp-dev26/AuditAI---GCP
    steps:
      - name: Checkout con historial completo
        if: ${{ env.MIRROR_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push espejo (force) al repo de Carlos
        if: ${{ env.MIRROR_TOKEN != '' }}
        run: |
          git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/${CARLOS_REPO}.git" HEAD:main
          echo "Espejo actualizado: ${CARLOS_REPO} (rama main)."

      - name: Aviso si falta configurar el secret
        if: ${{ env.MIRROR_TOKEN == '' }}
        run: |
          echo "MIRROR_TOKEN aun no configurado -> espejo OMITIDO (no es un error)."
          echo "Configura el secret MIRROR_TOKEN en este repo para activar el espejo."
