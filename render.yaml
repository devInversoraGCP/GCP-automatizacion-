# Blueprint de Render para el backend del correo F29 (AuditAI).
# Con esto, en Render: New + -> "Blueprint" -> seleccionar este repo -> Apply.
# Render lee este archivo y auto-configura el servicio (root dir, build, start, health).
# Solo tendras que PEGAR los 2 secretos marcados abajo (sync: false).
#
# Guia completa: MIGRACION-A-RENDER.md
services:
  - type: web
    name: auditai-backend
    runtime: python
    plan: starter                    # $7/mes always-on: SIN sleep ni cold-start. Cambiado desde 'free' (09-jul-2026). NO revertir a free o vuelve el cold-start.
    region: oregon                   # cambiable (oregon/virginia/frankfurt); Virginia suele ir bien desde Chile
    rootDir: notion_automation       # CLAVE: el codigo esta en esta subcarpeta
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true                 # cada git push a main -> redeploy automatico
    envVars:
      # --- Secretos: Render te los pedira al aplicar el blueprint (NO se guardan en el repo) ---
      - key: NOTION_TOKEN
        sync: false                  # pegar el token de la integracion de Notion (esta en notion_automation/.env)
      - key: WEBHOOK_SECRET
        sync: false                  # pegar el WEBHOOK_SECRET NUEVO (esta en notion_automation/.env) - el mismo va en el boton de Notion
      # --- No secretos: valores por defecto (editables en el panel) ---
      - key: EMAIL_FROM
        value: notificaciones@inversoragcp.com
      - key: EMAIL_CONTACTO
        value: contacto@gcp.cl
      # ASESORES_SMTP_JSON es OPCIONAL: asesores_smtp.json esta versionado en el repo (decision 08-jul),
      # asi que Render lo lee del archivo directamente. Si prefieres inyectarlo por env var,
      # agrega aqui: - key: ASESORES_SMTP_JSON / sync: false  (tiene prioridad sobre el archivo).

  # --- Cron SEMANAL: reconciliacion del sandbox (MDM) ---------------------------
  # Alimenta el sandbox maestro desde las 4 tablas operativas (Contable/RRHH/CRM/
  # Tickets): puebla relaciones + crea fichas nuevas. 100% automatico, sin accion
  # de los asesores. IDEMPOTENTE. Solo escribe en el sandbox (regla de oro).
  # Ver reconciliar.py y docs/plan. NOTA de cambio de mes: Contable se renombra en
  # sitio (mismo data source), pero al aparecer un RRHH nuevo (ej. RRHH JULIO 2026)
  # hay que re-apuntar FUENTES/relacion RRHH al nuevo data source (docs/dev/18 §4).
  - type: cron
    name: auditai-reconciliacion
    runtime: python
    plan: starter
    region: oregon
    rootDir: notion_automation
    buildCommand: pip install -r requirements.txt
    schedule: "0 9 * * 1"            # lunes 09:00 UTC (~05:00 Chile), semanal
    startCommand: python reconciliar.py --aplicar
    envVars:
      - key: NOTION_TOKEN
        sync: false                  # pegar el MISMO token de Notion que el web service
      # Para el aviso por correo si el cron falla (avisar_excepcion_admin). Si no
      # se setean, el fallo queda solo en el log de Render (igual visible).
      - key: SENDGRID_API_KEY
        sync: false                  # mismo valor que el web service
      - key: ADMIN_ALERT_EMAIL
        sync: false                  # correo(s) del admin, separados por coma

  # --- Cron MENSUAL: aviso de cambio de mes, CONTABLE (día 1) --------------------
  # Envía el instructivo (correo-cambio-mes.html) desde dev@inversoragcp.com a los
  # asesores, como recordatorio al abrir el mes. Evita que el cambio de página mal
  # hecho rompa la automatización. Best-effort (sin API key → no envía, solo log).
  # Son DOS crons porque las planillas no rotan el mismo día (Sebastián, 06-ago-2026):
  # Contable el 1 y RRHH el 13. `--planilla` recorta el HTML a lo que aplica.
  # OJO: este servicio conserva su nombre original a propósito. Renombrarlo haría
  # que Render cree uno nuevo y deje el viejo corriendo el aviso combinado => dos
  # correos el día 1. El único servicio NUEVO es el de RRHH, más abajo.
  - type: cron
    name: auditai-aviso-cambio-mes
    runtime: python
    plan: starter
    region: oregon
    rootDir: notion_automation
    buildCommand: pip install -r requirements.txt
    schedule: "0 12 1 * *"          # día 1 de cada mes, 12:00 UTC (~08:00 Chile)
    startCommand: python enviar_aviso_cambio_mes.py --planilla contable
    envVars:
      - key: SENDGRID_API_KEY
        sync: false                  # mismo valor que el web service
      - key: NOTION_TOKEN
        sync: false                  # para resolver qué planilla está conectada este mes

  # --- Cron MENSUAL: aviso de cambio de mes, RRHH (día 13) ----------------------
  - type: cron
    name: auditai-aviso-cambio-mes-rrhh
    runtime: python
    plan: starter
    region: oregon
    rootDir: notion_automation
    buildCommand: pip install -r requirements.txt
    schedule: "0 12 13 * *"         # día 13 de cada mes, 12:00 UTC (~08:00 Chile)
    startCommand: python enviar_aviso_cambio_mes.py --planilla rrhh
    envVars:
      - key: SENDGRID_API_KEY
        sync: false                  # mismo valor que el web service
      - key: NOTION_TOKEN
        sync: false                  # para resolver qué planilla está conectada este mes
